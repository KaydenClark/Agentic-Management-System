[project]
name = "ams"
version = "0.0.0"
description = "Agentic Management System: Python runtime and backends (Grill Board, RSI loop, Supabase writer)."
requires-python = "==3.14.*"
dependencies = []

[project.scripts]
ams-board = "ams.grill_board.server:main"
ams-keycheck = "ams.keycheck:main"
ams-writer = "ams.writer:main"
ams-rsi = "ams.rsi_rows:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
