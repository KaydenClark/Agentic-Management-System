name: site builds

# Replaces Vercel preview builds as the PR check for site work (ADR-003I),
# so the free Vercel deployment quota is spent only on main and dev.
on:
  pull_request:
    branches: [dev, main]
    paths: ["site/**", "grill-board/theme/**", ".github/workflows/site-build.yml"]

permissions:
  contents: read

jobs:
  site:
    name: site builds
    # Public fork code must not execute automatically on the shared CI VM.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, servitor]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Check for the site app
        id: app
        working-directory: .
        run: |
          if [ -f site/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No site/package.json on this branch; nothing to build."; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        if: steps.app.outputs.present == 'true'
      - run: npm run lint --if-present
        if: steps.app.outputs.present == 'true'
      - run: npm run build
        if: steps.app.outputs.present == 'true'
      - run: npm test
        if: steps.app.outputs.present == 'true'
      # S-001 TK-002: the repository's hygiene rules over the served build.
      - uses: astral-sh/setup-uv@v6
        if: steps.app.outputs.present == 'true'
      - name: Public hygiene over the built site
        if: steps.app.outputs.present == 'true'
        working-directory: .
        run: uv run ams-hygiene --site site
