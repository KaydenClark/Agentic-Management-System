name: python tests

# Runs the Python suite (runtime, Grill Board, Supabase writers with stubbed
# HTTP), the room's doctor, and the 375px board check on every PR. No path
# filter, so the check always reports. Live Supabase tests stay skipped:
# CI holds no keys (AMS_LIVE is never set here).
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the secret scan reads every commit
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Git identity for tests that build temp repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: uv run pytest -q
      - name: Room doctor
        run: node workbench/tools/spec-workbench.mjs doctor
      - name: Grill Board at 375px
        run: |
          uv run --with playwright python -m playwright install --with-deps chromium
          uv run --with playwright pytest -q tests/test_grill_board_phone.py
